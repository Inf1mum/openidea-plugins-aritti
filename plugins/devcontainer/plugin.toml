id = "aritti.devcontainer"
name = "Dev Container CLI"
version = "0.3.0" # x-release-please-version
description = "Creates Dev Container configurations from bundled image templates with optional cached feature selection, without running a CLI. Starts, rebuilds and stops the project's Dev Container (containers.dev) and opens a shell in it, using the devcontainer CLI. Adds a devcontainer.json template to the New menu. Requires the devcontainer CLI (npm i -g @devcontainers/cli) and Docker. The IDE itself keeps running on the host."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Run targets now check the exact container you registered and refuse to launch when it was rebuilt or Docker is not reachable. Extra volume mounts below the project folder (such as node_modules) no longer block registration. Clone Repository now runs git in a terminal so large repositories finish. Compose and feature checks are cached so typing stays fast. The plugin no longer loads on every file open and save. Clearer wording for the Services commands and the Run target review."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:containers", "on-view:run-target-review"]

[capabilities]
required = ["project.read"]
# git: Clone Repository. storage: per-project configuration choices and feature cache. net:containers.dev: Refresh Feature List.
optional = ["process:devcontainer", "process:docker", "process:git", "storage", "net:containers.dev"]

