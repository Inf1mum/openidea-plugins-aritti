id = "aritti.ignore"
name = ".ignore"
version = "0.3.0" # x-release-please-version
description = "Support for ignore files (.gitignore, .dockerignore, .npmignore, .hgignore and 30 more). Reports duplicate, redundant, relative and malformed entries and invalid `syntax:` values, with quick fixes. Completes `syntax:` in .hgignore, opens the file an entry names on Ctrl-click and highlights ignore files the IDE does not recognise. A tool window adds github/gitignore and user templates. The status bar shows Ignored while you edit an ignored file, a notification warns about a Git project without a .gitignore, and any file gets an Add to .gitignore quick fix. Templates from github/gitignore (CC0-1.0)."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/ignore"
license = "MIT"
change-notes = "Fixed the Ignored status for whitelist patterns such as `*` with `!*/`, so files under re-included folders stay ignored unless a rule matches them. Patterns with many wildcards no longer slow the editor down, and an unclosed [ now matches nothing, as in Git. Quick fixes are skipped for ignore files over 128 KiB. Problems show once instead of twice, and checks of large ignore files stay fast: redundant entries are looked for in files up to 512 entries. Path completion finds folders in large projects. In .hgignore the same pattern under glob and regexp is no longer a duplicate."
categories = ["vcs", "linters"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:templates", "on-event:file-opened", "on-event:file-saved", "on-event:editor-focused"]

[capabilities]
required = ["project.read", "editor.read", "editor.write", "events", "storage"]
optional = ["process:git", "process:python3", "vcs.read"]

# Ignore files the IDE doesn't know yet; .gitignore, .dockerignore, .npmignore…
# are the built-in `ignore` language.
[[contributes.languages]]
path = "languages/dotignore.toml"

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers"]
languages = ["ignore", "dotignore"]

# Quick fixes in ignore files, Add to .gitignore in every other file.
[[contributes.providers]]
kinds = ["code-actions"]
languages = ["*"]

[[contributes.commands]]
id = "add-selected"
title = "Add Selected Paths to the Open Ignore File"
category = "Ignore"

[[contributes.commands]]
id = "unignore-selected"
title = "Unignore Selected Paths in the Open Ignore File"
category = "Ignore"

[[contributes.commands]]
