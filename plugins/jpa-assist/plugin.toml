name = "Reviewed JPQL Console Profile (Hibernate 6)"
extension = "json"
path = "adapters/jpql-6.6.49-profile.example.json"

[[contributes.fileTemplates]]
id = "jpql-console-hibernate7-profile"
name = "Reviewed JPQL Console Profile (Hibernate 7)"
extension = "json"
path = "adapters/jpql-7.4.15-profile.example.json"

[[contributes.markerIcons]]
id = "repository"
icon = "icons/marker-repository.svg"
