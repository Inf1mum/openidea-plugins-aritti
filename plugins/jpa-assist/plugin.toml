id = "aritti.jpa-assist"
name = "JPA Assist"
version = "0.2.0" # x-release-please-version
description = "JPA and Spring Data support for Java and Kotlin. Checks entities and repositories and offers quick fixes, completes derived query methods, generates equals/hashCode and toString, copies an entity's DDL (PostgreSQL or MySQL) or DTO, copies an entity from a CREATE TABLE statement, lists source entities in the native Persistence tool window and adds New › JPA Entity and Spring Data Repository templates."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: live database connections (read-only, opt-in): JPA: Manage Database Connections saves connection profiles (PostgreSQL, MySQL, MariaDB and H2 over a file or TCP; never a password) from Spring or manual entry with a user-supplied JDBC driver jar; JPA: Test Database Connection and JPA: Browse Database Schema launch a bundled helper through the optional process:java permission, confirm every new URL first, ask for the password in a visible (unmasked) box unless the Spring config holds it literally, and require a schema or table filter above 500 tables; SQL Server, Oracle and Db2 stay disabled; no database is written and nothing feeds reverse engineering yet. Unreleased: entity-to-repository gutter markers use their own icon. Unreleased: reviewed Embedded ID selection uses current same-package Java composite-key sources for eligible Java/Kotlin owners, with namespace, duplicate, ownership and freshness checks; broader composite-key and runtime parity remain open. Unreleased: Persistence Designer provides reviewed current-source Java scalar column edits with version-checked Apply; Kotlin and unresolved models remain read-only. Reviewed embeddable and mapped-superclass creation is available through editor intentions. Full JPA Buddy parity remains open. Unreleased: independent no-association JPQL lexical language and exact source-owned NamedQuery/NamedNativeQuery injections; persistence-unit semantics remain unresolved. Unreleased: source-local no-identifier information notes and positive saved-source repository ID compatibility warnings, with exact qualified identities, bounded cache and freshness checks; inherited/XML/provider mappings remain unresolved. Unreleased: live current-source identifier conflict diagnostics for owned plain Java entities declaring multiple EmbeddedId fields; inherited/property/XML mappings remain unknown. Unreleased: Persistence naming and Locate Open File expand and identify the current owned source entity without claiming native selection; declared ID/relationship details use familiar tree icons. Unreleased: native source-linked structure tree and toolbar replace the packaged HTML wrapper; current-source navigation and existing editor actions are preserved. Live duplicate Version diagnostics for proved source-local field-access entities; unknown inheritance/property/external mappings remain quiet. Unreleased: Find Attribute Usages in This Document lists and navigates the same proved local declaration/graph inventory read-only, with fresh editor snapshot and owner checks. Reviewed source-local attribute Rename FileAction updates a strict private non-ID scalar declaration and exact local graph users, preserving physical Column and unrelated name roles. Scoped current-class NamedAttributeNode literal completion offers source field names with precise quote-preserving edits; unknown ownership stays quiet. Attribute snapshots require direct top-level class ownership; function-local Kotlin classes cannot borrow package-qualified hover or repository-domain identity. Scalar/structural attribute checks require a directly attached matching source class role; annotation-value and unknown contexts stay quiet. Kotlin val notes require owned direct plain Entity/scalar source and describe read-only access with unresolved effective mapping/provider behavior. Fetch notes and edits require a plain current Java type; inherited, generic and unknown layouts cannot capture enum/package expressions. Live class-role notes require direct declaration attachment; nested annotation values and member metadata cannot borrow later class roles. Automatic equality/toString templates use owned plain Java manual scalar-ID source, primitive-compatible comparisons and qualified names; cached inherited/unknown layouts stay outside the subset. Callback source templates require a direct canonical plain Entity role and use exact qualified event namespaces without guessed imports. Automatic entity quickfixes use owned current declarations and canonical enum/Lombok replacements; nested and unknown framework roles stay quiet. Live fetch notes require a direct matching canonical enum literal; dynamic, foreign or shadowed values stay unknown. Duplicate same-source listener lifecycle events are checked only with enclosing Entity argument ownership; unknown argument assignability stays quiet. Source-attached nested listener callbacks check plain modifiers, return type and argument count; parameter assignability remains unresolved. Explicit same-source static nested listener attachments expose non-public no-arg constructors as source notes; external/container construction remains unresolved. Owned EmbeddedId getters establish source property intent; mixed-access notes label source placements without asserting provider/hierarchy outcomes. Live eager/Lombok/scalar notes share direct declaration ownership; nonpersistent helper and nested metadata cannot borrow current entity meaning. Live attribute conflicts require direct declaration attachment; nested anonymous/body/annotation-value mappings cannot borrow an outer entity attribute role. Cached source-class hints stay within matching supplied source groups, retain minimal facts and label unresolved compiler bindings; main/test roles cannot borrow each other. Cached positive class identities require verified top-level source scope; nested/local types cannot borrow top-level qualified names. Source setter notes require a leading mapping on a supported instance getter; nested/body/transient/static/private/void/incomplete method roles remain unknown. Exact literal class-level PROPERTY access retains source-only missing-setter notes under the existing plain Entity ownership boundary. Missing-setter notes require a plain source-complete Entity context; inherited/generated/extra-annotation contexts stay unknown and source absence is labeled explicitly. Dynamic Query expression/property placeholders stay unknown rather than leaking expression/default colons into method-parameter warnings. Explicit native SQL query parameter notes ignore standard comments; unknown escapes/dynamic/dialect/comment contexts stay quiet with exact source ranges. Kotlin association collection notes require exact read-only API ownership and describe source operations only, without provider/runtime failure claims. Live/cache framework annotation admission requires canonical FQNs or unique single imports for every consumed mapping tag; wildcard/local/alias/ambiguous/mixed namespaces stay unknown. Relationship type diagnostics now require exact primitive/array/JDK basic or collection evidence; vendor scalar/collection lookalikes stay unknown. Explicit annotation ownership now matches canonical JPA/Spring Data JPA/Lombok names; lookalike subpackages and other Spring repository Query annotations remain unknown. Cached positive role diagnostics now refuse ambiguous imports and generic/inherited/nested/current-prefix shadows; nonprimitive scalar ownership uses the same current-context proof. Live scalar checks require primitive/exact JDK type ownership; foreign or shadowed scalar spellings remain unknown, qualified positive cached types retain their exact owner. Repeated lifecycle events on distinct supported current Entity methods are reported; one method may handle several events. Source-proved Java Entity callbacks reject static/final and invalid plain signatures; live listener-role guessing removed, unknown roles stay quiet. Live source-local NamedAttributeNode diagnostics for proved plain Java field-access entity models; unknown inherited/property/type/module contexts remain quiet. Attribute creation now uses only the lazy reviewed editor FileAction; the direct-writing New Attribute command/menu and unused editor.write grant are removed. Review a source-derived scalar SQL table draft with explicit dialect/table/file target, exact confirmation and atomic non-overwriting Create; simple Java manual-ID subset only, no database execution. New checks: entity graph names (@EntityGraph and getEntityGraph against @NamedEntityGraph, attributePaths against the repository entity), missing setters with property access, association targets that are not entities; persistence.xml property name and value completion; New Entity generation uses previewed, atomic FileActions; the command copies source only. Earlier in this release: attribute signatures (two associations on one attribute, an association on a basic or collection type, @Id with @EmbeddedId, getter and field annotations mixed), listener without a public no-arg constructor, the kotlin-jpa compiler plugin read from the build files (missing, with a quick fix that edits build.gradle(.kts); redundant no-arg constructor; redundant open under allopen), attribute names in @AttributeOverride, @MapsId, @MapKey and @NamedAttributeNode, :parameters of @Query and unknown named queries, persistence.xml and orm.xml values and classes (with class name completion in <class>), and an Add inverse attribute action on ManyToOne, OneToOne and ManyToMany. New Entity (class name, table, ID strategy, auditing, version, equals/hashCode; copied, and written into an empty file in focus) and New Attribute (type or association, cascade, fetch, nullability; added to the end of the entity class with its imports) commands. 0.2.0: Copy DDL and Copy DTO show only in entity files and Copy Entity only in SQL files with a CREATE TABLE; right-click an entity in JPA Structure to copy its DDL or DTO; Copy DDL asks for the SQL dialect, Copy DTO for the fields, Copy Entity for the language (the settings are the defaults); needs OpenIDEA 1.2. 0.2.0: derived query completion and checks in Spring Data repositories, a check of the repository id type, Generate equals() and hashCode() and Generate toString() actions, Copy DDL (current entity or all entities), Copy DTO, Copy Entity from CREATE TABLE and the JPA Structure tool window. 0.1.0: first release, with entity checks on open and save, quick fixes that make associations lazy, replace @Data and remove final from entity classes, and entity and repository templates. Unreleased: effective persistence settings without a database: persistence.xml units (class, exclude-unlisted-classes, mapping-file, hibernate.dialect, hbm2ddl, JDBC URL) or, without one, literal Spring Boot spring.jpa/spring.datasource properties pre-select the Copy DDL and Hibernate console dialect (a prompt picks among several units); Info when no unit lists or scans an entity (JPA 3.1 section 8.2.1.6; mapping/jar files keep it quiet) and when javax/jakarta imports differ from the persistence.xml schema (mixed imports stay quiet). Unreleased: unique META-INF/orm.xml and persistence.xml mapping-file entries now supply XML id, embedded-id and id-class declarations to the hierarchy identifier note and XML-only attribute names to entity graph node checks; any ambiguous, missing or metadata-complete mapping file keeps those checks quiet. Unreleased: literal inheritance annotation checks (entity combined with mapped superclass, discriminator annotations on a non-entity, discriminator column with TABLE_PER_CLASS, subclass repeating the root strategy) and an Info when an @Convert converter's AttributeConverter source type clearly differs from the JDK attribute type. Unreleased: opt-in (jpaAssist.jpqlMutationPreview) JPQL UPDATE/DELETE dry-run in the console for local embedded H2 targets only: statement analysis, refusal of multiple statements/comments/native SQL/remote URLs, exact review and a SELECT COUNT row preview; the statement is never executed (commit needs a reviewed adapter change). Unreleased: saved-source Info when a literal same-source-root extends chain of Entity/MappedSuperclass classes declares no Id, EmbeddedId or IdClass, and a Warning when @Convert(converter = X.class) names a same-root class that neither extends nor implements anything (Info when its interfaces list no AttributeConverter); unresolved or XML mappings stay quiet. Unreleased: optional version-qualified compiled Hibernate6/7 JPQL SELECT console with explicit JDBC/profile/artifact review, typed parameters, bounded scalar native table results and owned-process cancellation; real H2 qualification only, no runtime entity semantic inference. Unreleased: source-owned entity relationship diagram with qualified source-set identities, positive edges, completeness status and fresh navigation. Unreleased: independent no-association JPQL lexical language and exact source-owned NamedQuery/NamedNativeQuery injections; persistence-unit semantics remain unresolved. Unreleased: source-local no-identifier information notes and positive saved-source repository ID compatibility warnings, with exact qualified identities, bounded cache and freshness checks; inherited/XML/provider mappings remain unresolved. Unreleased: live current-source identifier conflict diagnostics for owned plain Java entities declaring multiple EmbeddedId fields; inherited/property/XML mappings remain unknown. Unreleased: Persistence naming and Locate Open File expand and identify the current owned source entity without claiming native selection; declared ID/relationship details use familiar tree icons. Unreleased: native source-linked structure tree and toolbar replace the packaged HTML wrapper; current-source navigation and existing editor actions are preserved. Live duplicate Version diagnostics for proved source-local field-access entities; unknown inheritance/property/external mappings remain quiet. Unreleased: Find Attribute Usages in This Document lists and navigates the same proved local declaration/graph inventory read-only, with fresh editor snapshot and owner checks. Reviewed source-local attribute Rename FileAction updates a strict private non-ID scalar declaration and exact local graph users, preserving physical Column and unrelated name roles. Scoped current-class NamedAttributeNode literal completion offers source field names with precise quote-preserving edits; un