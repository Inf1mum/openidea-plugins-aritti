id = "aritti.jpa-assist"
name = "JPA Assist"
version = "0.2.0" # x-release-please-version
description = "JPA and Spring Data support for Java and Kotlin. Checks entities and repositories and offers quick fixes, completes derived query methods, generates equals/hashCode and toString, copies an entity's DDL (PostgreSQL or MySQL) or DTO, copies an entity from a CREATE TABLE statement, lists entities in a JPA Structure tool window and adds New › JPA Entity and Spring Data Repository templates."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Live duplicate Version diagnostics for proved source-local field-access entities; unknown inheritance/property/external mappings remain quiet. Unreleased: Find Attribute Usages in This Document lists and navigates the same proved local declaration/graph inventory read-only, with fresh editor snapshot and owner checks. Reviewed source-local attribute Rename FileAction updates a strict private non-ID scalar declaration and exact local graph users, preserving physical Column and unrelated name roles. Scoped current-class NamedAttributeNode literal completion offers source field names with precise quote-preserving edits; unknown ownership stays quiet. Attribute snapshots require direct top-level class ownership; function-local Kotlin classes cannot borrow package-qualified hover or repository-domain identity. Scalar/structural attribute checks require a directly attached matching source class role; annotation-value and unknown contexts stay quiet. Kotlin val notes require owned direct plain Entity/scalar source and describe read-only access with unresolved effective mapping/provider behavior. Fetch notes and edits require a plain current Java type; inherited, generic and unknown layouts cannot capture enum/package expressions. Live class-role notes require direct declaration attachment; nested annotation values and member metadata cannot borrow later class roles. Automatic equality/toString templates use owned plain Java manual scalar-ID source, primitive-compatible comparisons and qualified names; cached inherited/unknown layouts stay outside the subset. Callback source templates require a direct canonical plain Entity role and use exact qualified event namespaces without guessed imports. Automatic entity quickfixes use owned current declarations and canonical enum/Lombok replacements; nested and unknown framework roles stay quiet. Live fetch notes require a direct matching canonical enum literal; dynamic, foreign or shadowed values stay unknown. Duplicate same-source listener lifecycle events are checked only with enclosing Entity argument ownership; unknown argument assignability stays quiet. Source-attached nested listener callbacks check plain modifiers, return type and argument count; parameter assignability remains unresolved. Explicit same-source static nested listener attachments expose non-public no-arg constructors as source notes; external/container construction remains unresolved. Owned EmbeddedId getters establish source property intent; mixed-access notes label source placements without asserting provider/hierarchy outcomes. Live eager/Lombok/scalar notes share direct declaration ownership; nonpersistent helper and nested metadata cannot borrow current entity meaning. Live attribute conflicts require direct declaration attachment; nested anonymous/body/annotation-value mappings cannot borrow an outer entity attribute role. Cached source-class hints stay within matching supplied source groups, retain minimal facts and label unresolved compiler bindings; main/test roles cannot borrow each other. Cached positive class identities require verified top-level source scope; nested/local types cannot borrow top-level qualified names. Source setter notes require a leading mapping on a supported instance getter; nested/body/transient/static/private/void/incomplete method roles remain unknown. Exact literal class-level PROPERTY access retains source-only missing-setter notes under the existing plain Entity ownership boundary. Missing-setter notes require a plain source-complete Entity context; inherited/generated/extra-annotation contexts stay unknown and source absence is labeled explicitly. Dynamic Query expression/property placeholders stay unknown rather than leaking expression/default colons into method-parameter warnings. Explicit native SQL query parameter notes ignore standard comments; unknown escapes/dynamic/dialect/comment contexts stay quiet with exact source ranges. Kotlin association collection notes require exact read-only API ownership and describe source operations only, without provider/runtime failure claims. Live/cache framework annotation admission requires canonical FQNs or unique single imports for every consumed mapping tag; wildcard/local/alias/ambiguous/mixed namespaces stay unknown. Relationship type diagnostics now require exact primitive/array/JDK basic or collection evidence; vendor scalar/collection lookalikes stay unknown. Explicit annotation ownership now matches canonical JPA/Spring Data JPA/Lombok names; lookalike subpackages and other Spring repository Query annotations remain unknown. Cached positive role diagnostics now refuse ambiguous imports and generic/inherited/nested/current-prefix shadows; nonprimitive scalar ownership uses the same current-context proof. Live scalar checks require primitive/exact JDK type ownership; foreign or shadowed scalar spellings remain unknown, qualified positive cached types retain their exact owner. Repeated lifecycle events on distinct supported current Entity methods are reported; one method may handle several events. Source-proved Java Entity callbacks reject static/final and invalid plain signatures; live listener-role guessing removed, unknown roles stay quiet. Live source-local NamedAttributeNode diagnostics for proved plain Java field-access entity models; unknown inherited/property/type/module contexts remain quiet. Attribute creation now uses only the lazy reviewed editor FileAction; the direct-writing New Attribute command/menu and unused editor.write grant are removed. Review a source-derived scalar SQL table draft with explicit dialect/table/file target, exact confirmation and atomic non-overwriting Create; simple Java manual-ID subset only, no database execution. New checks: entity graph names (@EntityGraph and getEntityGraph against @NamedEntityGraph, attributePaths against the repository entity), missing setters with property access, association targets that are not entities; persistence.xml property name and value completion; New Entity generation uses previewed, atomic FileActions; the command copies source only. Earlier in this release: attribute signatures (two associations on one attribute, an association on a basic or collection type, @Id with @EmbeddedId, getter and field annotations mixed), listener without a public no-arg constructor, the kotlin-jpa compiler plugin read from the build files (missing, with a quick fix that edits build.gradle(.kts); redundant no-arg constructor; redundant open under allopen), attribute names in @AttributeOverride, @MapsId, @MapKey and @NamedAttributeNode, :parameters of @Query and unknown named queries, persistence.xml and orm.xml values and classes (with class name completion in <class>), and an Add inverse attribute action on ManyToOne, OneToOne and ManyToMany. New Entity (class name, table, ID strategy, auditing, version, equals/hashCode; copied, and written into an empty file in focus) and New Attribute (type or association, cascade, fetch, nullability; added to the end of the entity class with its imports) commands. 0.2.0: Copy DDL and Copy DTO show only in entity files and Copy Entity only in SQL files with a CREATE TABLE; right-click an entity in JPA Structure to copy its DDL or DTO; Copy DDL asks for the SQL dialect, Copy DTO for the fields, Copy Entity for the language (the settings are the defaults); needs OpenIDEA 1.2. 0.2.0: derived query completion and checks in Spring Data repositories, a check of the repository id type, Generate equals() and hashCode() and Generate toString() actions, Copy DDL (current entity or all entities), Copy DTO, Copy Entity from CREATE TABLE and the JPA Structure tool window. 0.1.0: first release, with entity checks on open and save, quick fixes that make associations lazy, replace @Data and remove final from entity classes, and entity and repository templates."
categories = ["frameworks", "linters"]
icon = "icon.svg"
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-view:structure"]

[capabilities]
required = ["events", "project.read", "editor.read", "storage"]
optional = ["clipboard"]

[[contributes.providers]]
kinds = ["completion", "code-actions", "line-markers", "diagnostics", "definition", "hover"]
languages = ["java", "kotlin", "xml"]

[[contributes.views]]
id = "structure"
title = "JPA Structure"
icon = "database"
location = "left"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "copy-ddl"
title = "JPA: Copy DDL of Current Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-ddl-all"
title = "JPA: Copy DDL of All Entities"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-dto"
title = "JPA: Copy DTO of Current Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-entity"
title = "JPA: Copy Entity from CREATE TABLE at Caret"
category = "JPA Assist"

[[contributes.commands]]
id = "new-entity"
title = "JPA: New Entity"
category = "JPA Assist"

[[contributes.menus]]
menu = "tools"
command = "copy-ddl-all"

[[contributes.menus]]
menu = "tools"
command = "new-entity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-ddl"
when = "(editorLangId == java || editorLangId == kotlin) && plugin.aritti.jpa-assist.isEntity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-dto"
when = "(editorLangId == java || editorLangId == kotlin) && plugin.aritti.jpa-assist.isEntity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-entity"
when = "editorLangId == sql && plugin.aritti.jpa-assist.hasCreateTable"



[contributes.settings]
title = "JPA Assist"
schema = "settings.schema.json"

[[contributes.fileTemplates]]
id = "entity-java"
name = "JPA Entity"
extension = "java"
path = "templates/Entity.java"

[[contributes.fileTemplates]]
id = "repository-java"
name = "Spring Data Repository"
extension = "java"
path = "templates/Repository.java"

[[contributes.fileTemplates]]
id = "entity-kotlin"
name = "JPA Entity (Kotlin)"
extension = "kt"
path = "templates/Entity.kt"

[[contributes.fileTemplates]]
id = "repository-kotlin"
name = "Spring Data Repository (Kotlin)"
extension = "kt"
path = "templates/Repository.kt"

[[contributes.commands]]
id = "find-attribute-usages"
title = "JPA: Find Attribute Usages in This Document"
category = "JPA Assist"

[[contributes.menus]]
menu = "editor.context"
command = "find-attribute-usages"
when = "editorLangId == java && plugin.aritti.jpa-assist.isEntity"
