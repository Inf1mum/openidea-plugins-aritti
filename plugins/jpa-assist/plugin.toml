categories = ["frameworks", "linters"]
icon = "icon.svg"
engines.openidea = "^1.5"
wasm = "dist/plugin.wasm"
activation = ["on-language:jpql", "on-event:file-opened", "on-event:file-saved", "on-view:structure", "on-view:designer"]

[capabilities]
required = ["events", "project.read", "editor.read", "storage"]
optional = ["clipboard", "process:java", "editor.write"]

[[contributes.providers]]
kinds = ["completion", "code-actions", "line-markers", "diagnostics", "definition", "hover", "injections"]
languages = ["java", "kotlin", "xml"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["sql"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["properties"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["plaintext", "log"]

[[contributes.views]]
id = "structure"
title = "Persistence"
icon = "database"
location = "left"
group = "persistence"

[[contributes.views]]
id = "designer"
title = "Persistence Designer"
icon = "edit"
location = "right"
web = "web/designer.html"

[[contributes.commands]]
id = "inspect-at-caret"
title = "JPA: Inspect at Caret"
category = "JPA Assist"

[[contributes.menus]]
menu = "editor.context"
command = "inspect-at-caret"
when = "editorLangId == java || editorLangId == kotlin"

[[contributes.commands]]
id = "copy-ddl"
title = "JPA: Copy DDL of Current Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-ddl-all"
title = "JPA: Copy DDL of All Entities"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-dto"
title = "JPA: Copy DTO of Current Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-entity"
title = "JPA: Copy Entity from CREATE TABLE at Caret"
category = "JPA Assist"

[[contributes.commands]]
id = "new-entity"
title = "JPA: New Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "jdbc-manage"
title = "JPA: Manage Database Connections"
category = "JPA Assist"

[[contributes.commands]]
id = "jdbc-test"
title = "JPA: Test Database Connection"
category = "JPA Assist"

[[contributes.commands]]
id = "jdbc-browse"
title = "JPA: Browse Database Schema"
category = "JPA Assist"

[[contributes.menus]]
menu = "tools"
command = "copy-ddl-all"

[[contributes.menus]]
menu = "tools"
command = "new-entity"

[[contributes.menus]]
menu = "tools"
command = "jdbc-manage"

[[contributes.menus]]
menu = "tools"
command = "jdbc-test"

[[contributes.menus]]
menu = "tools"
command = "jdbc-browse"

[[contributes.menus]]
menu = "editor.context"
command = "copy-ddl"
when = "(editorLangId == java || editorLangId == kotlin) && plugin.aritti.jpa-assist.isEntity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-dto"
when = "(editorLangId == java || editorLangId == kotlin) && plugin.aritti.jpa-assist.isEntity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-entity"
when = "editorLangId == sql && plugin.aritti.jpa-assist.hasCreateTable"



[contributes.settings]
title = "JPA Assist"
schema = "settings.schema.json"

[[contributes.fileTemplates]]
id = "entity-java"
name = "JPA Entity"
extension = "java"
path = "templates/Entity.java"

[[contributes.fileTemplates]]
id = "repository-java"
name = "Spring Data Repository"
extension = "java"
path = "templates/Repository.java"

[[contributes.fileTemplates]]
id = "entity-kotlin"
name = "JPA Entity (Kotlin)"
extension = "kt"
path = "templates/Entity.kt"

[[contributes.fileTemplates]]
id = "repository-kotlin"
name = "Spring Data Repository (Kotlin)"
extension = "kt"
path = "templates/Repository.kt"

[[contributes.commands]]
id = "find-attribute-usages"
title = "JPA: Find Attribute Usages in This Document"
category = "JPA Assist"

[[contributes.menus]]
menu = "editor.context"
command = "find-attribute-usages"
when = "editorLangId == java && plugin.aritti.jpa-assist.isEntity"

[[contributes.commands]]
id = "structure-source"
title = "JPA: Jump to Source"
category = "JPA Assist"

[[contributes.menus]]
menu = "viewItem.context"
view = "structure"
command = "structure-source"

[[contributes.menus]]
menu = "viewItem.context"
view = "structure"
command = "copy-ddl"
when = "viewItemKind == entity"

[[contributes.menus]]
menu = "viewItem.context"
view = "structure"
command = "copy-dto"
when = "viewItemKind == entity"

[[contributes.languages]]
path = "languages/jpql.toml"

[[contributes.providers]]
kinds = ["completion"]
languages = ["jpql"]

[[contributes.views]]
id = "source-diagram"
title = "Source Diagram"
icon = "hierarchy"
location = "left"
group = "persistence"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "source-diagram"
title = "JPA: Show Source Entity Relationship Diagram"
category = "JPA Assist"

[[contributes.views]]
id = "jpql-console"
title = "JPQL Console"
icon = "database"
location = "left"
group = "persistence"

[[contributes.commands]]
id = "jpql-console-run"
title = "JPA: Run Reviewed JPQL SELECT…"
category = "JPA Assist"

[[contributes.commands]]
id = "jpql-console-status"
title = "JPA: Refresh JPQL Console Status"
category = "JPA Assist"

[[contributes.commands]]
id = "jpql-console-cancel"
title = "JPA: Cancel JPQL Console Query"
category = "JPA Assist"

[[contributes.fileTemplates]]
