[package]
name = "openidea-plugin-jpa-assist"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.42"
regex-lite = "0.1"
ui-kit = { path = "../../crates/ui-kit" }
spring-text = { path = "../../crates/spring-text" }
persistence-core = { path = "../../crates/persistence-core" }
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.42" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
