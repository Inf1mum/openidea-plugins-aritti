id = "aritti.spring-osgi"
name = "Spring OSGi"
version = "0.3.0" # x-release-please-version
description = "Spring Dynamic Modules (Spring OSGi) support for Spring XML files. Checks <osgi:service>, <osgi:reference>, <osgi:list>/<osgi:set> and their listeners: conflicting declarations, service beans that don't implement the exported interfaces, listener methods with a wrong signature, and listeners that don't implement OsgiServiceLifecycleListener. Adds Go to Definition and completion for bean references, exported interfaces and listener methods."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Diagnostics keep working after you open or save a file, and only the changed file is re-read. Files with a DOCTYPE or &amp; entities are analysed again. One oversized or unparseable Java file no longer silences service and listener checks. Projects with Kotlin sources no longer get false 'No bean named' hints. Generating a bean from an unsaved buffer now asks you to save the file first, and works in projects on a Windows drive. Diagnostics are faster on large XML files, and hint wording is plainer."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:xml"]

[capabilities]
required = []
optional = ["project.read", "events"]

[[contributes.providers]]
kinds = ["completion", "definition", "diagnostics", "code-actions", "hover"]
languages = ["xml"]
