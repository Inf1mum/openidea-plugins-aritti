id = "aritti.properties"
name = "Properties"
version = "0.2.0" # x-release-please-version
description = "Inspections and editing tools for .properties files. Reports duplicate keys, broken \\u escapes, trailing spaces, delimiters that don't match the code style, known missing translations, with quick fixes; text search reports potential unused-key candidates. Also removes a key from every locale, sorts and reformats files, groups keys by prefix in a structure view, edits a resource bundle as a table (Open With › Resource Bundle), goes to declaration in the parent locale or from Java/Kotlin strings, completes keys in i18n calls and simplelogger.properties, and copies a property's key or value. Ported from JetBrains' Properties plugin (com.intellij.properties) by JetBrains s.r.o., Apache-2.0."
authors = ["Arnaud Ritti", "JetBrains s.r.o. (original Properties plugin)"]
license = "Apache-2.0"
change-notes = "Unreleased: reviewed scoped key Rename updates visible bundle declarations and proven same-module Java/Kotlin JDK literals together, with complete source fingerprints, collision checks, separate encodings and exact before/after review. Unreleased: memory-only Revert last reviewed bundle edit control with exact after-text/version/project guards and confirmed inverse delta; native Undo is unchanged. Unreleased: navigation-index source metadata is bounded before reads, retaining unsaved-text postread limits. Unreleased: confirmed bundle-only key change with lossless escaping, duplicate/collision checks and explicit unchanged code references; atomic locale sources are admitted before reads. Unreleased: explicit source usage search validates bounded current project ownership and source metadata before reads. Unreleased: native bundle edits require rendered source binding and exact key/path/before-after review; stale or ambiguous rows and incomplete/oversized layouts refuse. Unreleased: copy commands refuse lossy UTF-16/Unicode conversion before changing the clipboard. Unreleased: preserve UTF-16 key identity for duplicate checks and refuse lossy keys in source references and bundle edit preparation. Unreleased: cached property facts revalidate current innermost project ownership, withholding reassigned resource sources without provider source reads. Unreleased: Java/Kotlin property links/completion/hover now require explicit JDK bundle/key calls and same-module conventional resource candidates; arbitrary framework literals and unknown getters stay quiet. Unreleased: confirmed atomic FileActions for cross-locale add/remove/sort and selected-locale value updates, preserving unsaved project text; locale creation with validated names and non-overwrite guard. Other-locale table cells open the file instead of writing through tee; the tee permission is removed. Earlier: live unused-key hints, related-locale navigation and incomplete-key filtering. Ported from com.intellij.properties 263.7307.108 (intellij-community idea/263.7307.112)."
categories = ["languages", "linters"]
icon = "icon.svg"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-event:files-changed"]

[capabilities]
required = ["project.read", "editor.read", "editor.write", "events"]
optional = ["clipboard"]

[[contributes.providers]]
kinds = ["code-actions", "definition", "completion"]
languages = ["properties"]

[[contributes.providers]]
kinds = ["definition", "completion"]
languages = ["java", "kotlin"]

[[contributes.providers]]
kinds = ["definition"]
languages = ["html", "jsp"]

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["properties"]

# Current-buffer declarations and cached candidate source declarations only.
[[contributes.providers]]
kinds = ["hover"]
languages = ["properties", "java", "kotlin", "html", "jsp"]

[[contributes.views]]
id = "structure"
title = "Properties Structure"
icon = "structure"
location = "right"
web = "web/resources/hub.html"

[[contributes.customEditors]]
id = "bundle"
title = "Resource Bundle"
patterns = ["*.properties"]
priority = "option"

[[contributes.commands]]
id = "copy-key"
title = "Properties: Copy Property Key"
category = "Properties"

[[contributes.commands]]
id = "copy-value"
title = "Properties: Copy Property Value"
category = "Properties"

[[contributes.commands]]
id = "reformat"
title = "Properties: Reformat File"
category = "Properties"

[[contributes.commands]]
id = "find-unused"
title = "Properties: Find Unused Properties"
category = "Properties"

[[contributes.commands]]
id = "find-owned-usages"
title = "Properties: Find Explicit Bundle Key Usages"
category = "Properties"

[contributes.settings]
schema = "settings.schema.json"
title = "Properties"

[[contributes.fileTemplates]]
id = "xml-properties"
name = "XML Properties File"
extension = "xml"
path = "templates/xml-properties.xml"

[[contributes.fileTemplates]]
id = "properties"
name = "Properties File"
extension = "properties"
path = "templates/properties.properties"
