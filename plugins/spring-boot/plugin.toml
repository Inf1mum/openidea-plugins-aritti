id = "aritti.spring-boot"
name = "Spring Boot Tools"
version = "0.3.0" # x-release-please-version
description = "Completion and checks for Spring Boot configuration files. Completes keys and values in application*.properties and application*.yml from a bundled Spring Boot fallback snapshot, explicitly selected version-qualified dependency JAR metadata, the project's configuration metadata files and its @ConfigurationProperties classes. Warns about deprecated keys (with a quick fix) and unknown keys in known groups, and checks cron expressions in @Scheduled(cron) and *.cron keys."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Completion, hover and checks now read one shared project index, so they no longer drop out while the project is being scanned. Fixed: a project enum named like a Spring type (Database, Show) no longer flags valid values; Kotlin @ConfigurationProperties no longer causes false unknown-key warnings; nested YAML logging.level completion keeps indentation; reading JAR metadata works for Spring Cloud release trains and uncached POMs; imported JAR metadata stays until the POM changes; a denied Gradle cache now says so; Windows project roots are recognised; Run with Profiles ignores nested projects."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = [
    "on-file:**/application*.properties",
    "on-file:**/application*.yml",
    "on-file:**/application*.yaml",
    "on-file:**/bootstrap*.properties",
    "on-file:**/bootstrap*.yml",
    "on-file:**/bootstrap*.yaml",
    "on-file:**/*spring-configuration-metadata.json",
    "on-language:java",
    "on-language:kotlin",
    "on-event:files-changed",
]

[capabilities]
required = ["project.read"]
optional = ["events", "fs.read:~/.m2/repository", "fs.read:~/.gradle/caches/modules-2/files-2.1", "editor.read", "database.sources", "process:mvn", "process:gradle"]

[[contributes.commands]]
id = "show-diagnostics"
title = "Spring Boot: Show Configuration Problems"
category = "Spring Boot"

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers"]
languages = ["properties", "yaml"]

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["json"]

[[contributes.providers]]
kinds = ["code-actions", "line-markers"]
languages = ["java"]

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["java", "json", "properties", "yaml"]

[[contributes.providers]]
kinds = ["hover", "inlay-hints"]
languages = ["properties", "yaml"]

[[contributes.runConfigurations]]
files = ["pom.xml", "build.gradle", "build.gradle.kts"]

[contributes.settings]
title = "Spring Boot"

[[contributes.settings.pages]]
id = "java"
title = "Java Source Checks"
schema = "settings-java.schema.json"

[[contributes.settings.pages]]
id = "configuration"
title = "Configuration and Metadata"
schema = "settings-configuration.schema.json"

[[contributes.settings.pages.actions]]
title = "Read static metadata from a selected dependency JAR…"
command = "read-dependency-jar-metadata"

[[contributes.fileIcons]]
id = "spring-boot-config"
patterns = ["application*.properties", "application*.yml", "application*.yaml", "bootstrap*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
icon = "icons/config.svg"
iconDark = "icons/config_dark.svg"

[[contributes.fileTemplates]]
id = "spring-boot-application-java"
name = "Spring Boot Application"
extension = "java"
path = "templates/Application.java"

[[contributes.fileTemplates]]
id = "spring-boot-application-kotlin"
name = "Spring Boot Application (Kotlin)"
extension = "kt"
path = "templates/Application.kt"

[[contributes.fileTemplates]]
id = "spring-boot-test-java"
name = "Spring Boot Test"
extension = "java"
path = "templates/BootTest.java"

[[contributes.fileTemplates]]
id = "spring-boot-test-kotlin"
name = "Spring Boot Test (Kotlin)"
extension = "kt"
path = "templates/BootTest.kt"

[[contributes.fileTemplates]]
id = "spring-boot-configuration-properties-java"
name = "Spring Boot ConfigurationProperties"
extension = "java"
path = "templates/ConfigurationProperties.java"

[[contributes.fileTemplates]]
id = "spring-boot-configuration-properties-kotlin"
name = "Spring Boot ConfigurationProperties (Kotlin)"
extension = "kt"
path = "templates/ConfigurationProperties.kt"

[[contributes.commands]]
id = "read-dependency-jar-metadata"
title = "Spring Boot: Read Metadata from Selected Dependency JAR…"
category = "Spring Boot"

[[contributes.commands]]
id = "current-file-placeholder-occurrences"
title = "Spring Boot: Current-File Placeholder Occurrences…"
category = "Spring Boot"

[[contributes.commands]]
id = "project-placeholder-occurrences"
title = "Spring Boot: Project Property Source Occurrences…"
category = "Spring Boot"

[[contributes.commands]]
id = "run-with-options"
title = "Spring Boot: Run with Profiles/Arguments…"
category = "Spring Boot"

[[contributes.commands]]
id = "configure-source-database"
title = "Spring Boot: Configure Database from Current Source…"
category = "Spring Boot"

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["kotlin"]
