id = "aritti.spring-shell"
name = "Spring Shell Tools"
version = "0.2.0" # x-release-please-version
description = "Spring Shell 3.x commands in Java and Kotlin projects, for both the @ShellComponent/@ShellMethod model and the @Command model. Checks availability methods (unknown command names, wrong return type), literal option/default/alias declarations and duplicate command names, completes command names, groups and provider beans, and links commands to their availability methods and providers. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: source provider/interface/local-class and option type proofs reject aliases/shadows and ambiguous cached bean names; structural Java Unicode source is withheld while established safe literal spans remain supported. description hover withholds escaped/textblock values rather than presenting partial lexer decoding as a declared description. Availability return type completion requires exact written canonical ownership. annotation ownership guards reject aliased/static/conflicting imports, source typealias/generic shadows and package-root collisions before command hover or source claims. literal option names/primitive conversion profiles and modern alias collision checks, corrected 3.4 command/arity semantics, and an exact-preview atomic ShellComponent insertion. verified Spring Shell 3.4 source-local description/availability/option-arity checks, command-side availability role fix, all literal provider-array entries checked, and exact modern annotation ownership. 4.x annotation owners remain outside this slice. 0.1.0 (first release): command index, availability checks and navigation, duplicate command check, completion of command names, groups and availability providers."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin"]

[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "diagnostics", "hover", "code-actions"]
languages = ["java", "kotlin"]
