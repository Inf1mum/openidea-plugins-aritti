id = "aritti.spring-shell"
name = "Spring Shell Tools"
version = "0.3.0" # x-release-please-version
description = "Spring Shell 3.x/4.x commands in Java and Kotlin projects, for both the @ShellComponent/@ShellMethod model and the @Command model. Checks availability methods (unknown command names, wrong return type), literal option/default/alias declarations and duplicate command names, completes command names, groups and provider beans, and links commands to their availability methods and providers."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Renaming a command key now refuses to run on a partly indexed project instead of missing subclasses. Deleted or moved files no longer cause false duplicate-command errors. Abstract base classes are no longer asked to add @ShellComponent. Code lenses are shown only for commands with more than one occurrence and stay valid across open files. Fixes and renames on unsaved files say 'Save the file first'. Fixes now work with Windows drive-letter project roots."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-event:files-changed"]

[capabilities]
required = ["project.read"]
optional = ["editor.read", "events"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "diagnostics", "hover", "code-actions"]
languages = ["java", "kotlin"]

[[contributes.commands]]
id = "command-occurrences"
title = "Spring Shell: Find Literal Command or Availability Occurrences"
category = "Spring Shell"

[[contributes.providers]]
kinds = ["document-highlights", "code-lenses"]
languages = ["java", "kotlin"]

[[contributes.markerIcons]]
id = "availability"
icon = "icons/marker-availability.svg"
