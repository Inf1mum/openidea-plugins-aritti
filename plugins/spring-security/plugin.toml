id = "aritti.spring-security"
name = "Spring Security Tools"
version = "0.3.0" # x-release-please-version
description = "Spring Security checks for Java. Flags WebSecurityConfigurerAdapter, @EnableGlobalMethodSecurity, antMatchers/mvcMatchers/regexMatchers and authorizeRequests (removed or deprecated in Spring Security 6), redundant ROLE_ prefixes in hasRole/hasAnyRole, NoOpPasswordEncoder and {noop} passwords, with quick fixes where the change is mechanical. Completes security expressions and the project's role names in @PreAuthorize, @PostAuthorize, @PreFilter and @PostFilter."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unknown bean reference notes stay on after the project index ages, and the index now follows saved and changed files. Java comments containing path globs such as /api/** no longer hide the rest of the file from the matcher and debug checks. Matcher hints now show only what is known (HTTP method, matcher type), and hover text is shorter. The old warning for `**` before the last path segment was removed; the path matcher now checks path patterns."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-language:xml", "on-event:files-changed"]

[capabilities]
required = ["project.read"]
optional = ["events"]

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers", "injections"]
languages = ["java", "kotlin", "xml"]

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["java", "kotlin", "xml"]

[[contributes.providers]]
kinds = ["hover", "inlay-hints"]
languages = ["xml", "java"]

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Security"
