id = "aritti.spring-integration"
name = "Spring Structure Tools"
version = "0.2.0" # x-release-please-version
description = "Spring Structure window and editor support for Spring Integration, Spring Batch and Spring Modulith. Integration: channel index for Java and XML, navigation and completion of channel names and bean refs, producer/consumer gutter arrows, unconsumed channel warnings. Batch: XML job navigation, completion and transition/bean checks, spring.batch.job.name navigation, Spring Batch 5 migration hints. Modulith: application module checks, allowedDependencies completion, open-module quick fix. One Spring Structure tool window switches between the integration channels, batch jobs, modulith modules and the module diagram; modules whose dependency the build files do not mention stay idle. Replaces aritti.spring-batch and aritti.spring-modulith: uninstall them to avoid duplicate windows and completions. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: explicit current-document Batch step usages picker lists proved declaration/reference kinds, paths and UTF-16 ranges with fresh read-only navigation. Unreleased: explicit same-document flat-job Batch step Rename previews a unique declaration and all direct literal next/to/restart links with source/collision/owner guards. Unreleased: parameter completion destinations reuse exact source/XML expression admission, including empty keys, and withhold foreign/comment contexts. Unreleased: indexed XML parameter expressions require complete owned attribute contexts and reject comments/foreign or malformed source. Unreleased: indexed source parameter expressions require owned Spring Value annotations and complete ordinary literals. Unreleased: parameter-adder completion facts require an owned contiguous Spring JobParametersBuilder constructor chain. Unreleased: embedded Batch bean/Boot facts share exact annotation-origin/literal-name admission; uncertain source names withhold missing-bean warnings. Unreleased: Batch source job/step facts require exact Spring builder constructor ownership; guessed factory receivers are unresolved and suppress missing-job warnings. Unreleased: creation retains conservative DSL channel-name collision candidates even when read-only ownership is unproved; dynamic names refuse availability checks. Unreleased: cached Integration/Batch facts are pruned against current innermost project ownership before provider/diagram publication. Unreleased: XML Bean aliases resolve at exact source spans; foreign/inner IDs remain candidates, and creation cannot treat withheld/legacy XML names as empty. Unreleased: Bean navigation/completion requires exact source annotation/name ownership; unproved spellings retain conservative collision/uncertainty checks and withhold unsupported absence warnings. Unreleased: cached Batch diagrams share the complete XML envelope admission used by current editor source facts. Unreleased: embedded Batch links refuse foreign prefixed attributes and foreign namespace scope owners. Unreleased: XML source facts require a complete bounded single-root envelope; malformed/DTD/entity contexts no longer leak Integration or Batch live facts. Unreleased: XML channel facts refuse foreign prefixed attributes and namespace lookalike suffixes. Unreleased: DSL channel facts require exact Spring static-factory ownership and contiguous proved chains; foreign/shadowed receivers and guessed lambda factories are withheld. Unreleased: channel Bean declarations require exact Spring Bean/MessageChannel interface ownership and literal aliases instead of a Channel type-name suffix. Unreleased: endpoint annotation facts require exact explicit Spring ownership and ordinary literal arguments; ambiguous, concatenated or escaped source contexts are withheld. Unreleased: positive current-file Java MessageChannel Bean/ServiceActivator hover without project discovery; explicit source-cache recovery, unavailable-watch provenance and packaged refresh invalidation; exact-reviewed local Batch step next insertion/replacement within its physical job/flow; optional atomic create-and-import Java/Kotlin channel configuration, with exact combined preview and narrow Kotlin action registration; current-file channel occurrence picker with optional editor.read and source/owner drift checks; local channel navigation refuses same-file bean ID/name/alias collisions and explains ambiguity in hover; combined versioned live diagnostics from current text and cached module facts, without duplicate gutter publication; optional watched-event warming. Absorbs aritti.spring-batch and aritti.spring-modulith into one Spring Structure window with Channels, Batch, Modules and Diagram sections; uninstall aritti.spring-batch and aritti.spring-modulith, the old ids are no longer maintained and would show duplicate windows and completions. Command and storage ids of the absorbed modules are prefixed with batch. and modulith.; their old settings values are not migrated. 0.1.0 (first release): channel index (Java annotations, Java DSL, XML), navigation and completion of channel names and bean refs, producer/consumer gutter arrows, unconsumed channel and unknown bean warnings."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = [
    "on-language:java",
    "on-language:kotlin",
    "on-language:xml",
    "on-file:**/application*.properties",
    "on-file:**/application*.yml",
    "on-file:**/application*.yaml",
    "on-view:structure",
]

[capabilities]
required = ["project.read"]
optional = ["editor.read", "clipboard", "storage", "events"]

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers", "diagnostics", "hover"]
languages = ["java", "xml", "properties", "yaml"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["kotlin"]

[[contributes.views]]
id = "structure"
title = "Spring Structure"
icon = "icons/structure.svg"
location = "right"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "batch.current-file-step-usages"
title = "Spring Batch: Find Step Usages in This Document"
category = "Spring Batch"

[[contributes.commands]]
id = "integration.current-file-channel-occurrences"
title = "Spring Integration: Current File Channel Occurrences"
category = "Spring Integration"

[[contributes.commands]]
id = "modulith.copy-docs"
title = "Spring Modulith: Copy Module Diagram (PlantUML)"
category = "Spring Modulith"

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Structure"
