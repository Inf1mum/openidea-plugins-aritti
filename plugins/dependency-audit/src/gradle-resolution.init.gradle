// Owned, version-qualified Gradle9.9.1 export. No project build files are edited.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    gradle.rootProject.allprojects { p ->
        p.tasks.register('openideaDependencyAuditExport') {
            group = 'verification'
            description = 'Export the explicitly selected configuration for OpenIDEA dependency auditing'
            doLast {
                def configurationName = p.findProperty('openideaAuditConfiguration')?.toString()
                def outputDirectory = p.findProperty('openideaAuditOutput')?.toString()
                if (!configurationName || !outputDirectory) throw new GradleException('Missing owned export arguments')
                def configuration = p.configurations.findByName(configurationName)
                def result = [schema: 1, buildRoot: p.rootDir.absolutePath, project: p.path, buildFile: p.buildFile.absolutePath, configuration: configurationName, unavailable: false, dependencies: []]
                if (!configuration || !configuration.canBeResolved) {
                    result.unavailable = true
                } else {
                    def resolution = configuration.incoming.resolutionResult
                    def unresolved = resolution.allDependencies.find { it instanceof UnresolvedDependencyResult }
                    if (unresolved) throw new GradleException('Unresolved dependency; refusing a partial graph: ' + unresolved.attempted.displayName)
                    result.dependencies = resolution.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }.collect { component ->
                        [group: component.id.group, name: component.id.module, version: component.id.version]
                    }.sort { a, b -> (a.group + ':' + a.name + ':' + a.version) <=> (b.group + ':' + b.name + ':' + b.version) }
                }
                def output = new File(outputDirectory, 'gradle.jsonl')
                output.parentFile.mkdirs()
                output.append(JsonOutput.toJson(result) + '\n', 'UTF-8')
            }
        }
    }
}
