id = "aritti.dependency-audit"
name = "Dependency Audit"
version = "0.3.0" # x-release-please-version
description = "Checks Maven, Gradle, npm and Composer dependencies against the OSV.dev vulnerability database. Live editor diagnostics use cached results and show their query dates; fetching runs only on open/save or an explicit scan. Vulnerable dependencies are marked in pom.xml, build.gradle, build.gradle.kts, package.json, composer.json and their lockfiles when you open or save them, with a quick fix that upgrades to the nearest fixed version. Dependency Audit: Scan Project lists the project's vulnerable dependencies in the Vulnerable Dependencies tool window. Privacy: package names and versions (never source code) are sent to api.osv.dev, a free service run by Google. Turn off Check on open and save under Settings › Plugins › Dependency Audit to contact it only when you run a scan."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "uv.lock and poetry.lock are read correctly: dependency rows no longer rename a package and inline dependency tables no longer drop it. Packages from private registries (poetry [package.source], Cargo alternative registries, npm and yarn hosts other than npmjs/yarnpkg, composer dist hosts outside the public ones) are never sent to OSV.dev and appear in the report as private, not queried. Yarn alias ranges now point at the real package name."
categories = ["linters", "tools"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-view:vulnerabilities"]

[capabilities]
required = ["project.read", "storage"]
optional = ["project.write", "process:sbt", "process:osv-scanner-macho", "process:osv-scanner", "process:mvn", "process:gradle", "editor.read", "editor.write", "events", "vcs.read", "net:api.osv.dev"]

