id = "aritti.spring-beans"
name = "Spring Beans Navigator"
version = "0.3.0" # x-release-please-version
description = "Spring Framework beans for Java, Kotlin and XML configuration: finds stereotype classes, @Bean methods, Spring Data repositories and <bean> definitions; links injection points to the beans Spring would pick (by type through the project's type hierarchy, @Qualifier, @Primary, parameter name) and beans to where they are injected; navigates and completes bean names in qualifiers, XML references, SpEL @bean references and named pointcuts; completes SpEL #variables and pointcut designators; lists beans in a Spring Beans tool window, draws their dependencies in a Spring Bean Graph, and turns field injection into constructor injection."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Bean navigation, markers and completion work across the whole project with no 512-file limit and stay fast while typing. Large SQL files, unrelated XML and copies under target/ or build/ no longer leave the index incomplete. The Generate commands, Move Annotation String to Property and the XML bean intentions work on files of any size and show only the changed lines for review; the Move command now applies the change. @NoRepositoryBean interfaces are not beans, bean hover works next to generic classes, and Check Spring Configuration runs as a background task."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:spel", "on-language:java", "on-language:kotlin", "on-language:xml", "on-event:file-opened", "on-event:file-saved"]

[capabilities]
required = ["project.read", "editor.read"]
optional = ["events", "editor.write", "storage", "project.write"]

[[contributes.providers]]
kinds = ["definition", "line-markers", "completion", "code-actions", "diagnostics", "injections", "gutter-actions"]
languages = ["java", "kotlin", "xml"]

