<link rel="stylesheet" href="./command-workspace.css">
<section data-command-workspace aria-label="Artisan command workspace">
  <div class="command-columns">
    <aside class="command-list">
      <header class="command-sidebar-header">
      <div class="command-search"><label class="ui-visually-hidden" for="command-search">Find a command</label><input id="command-search" type="search" placeholder="Find a command…"><button type="button" id="discover" class="ui-button ui-icon-button" title="Refresh commands" aria-label="Refresh commands"><span data-ui-icon="update" aria-hidden="true"></span></button></div>
      <div class="command-runner-controls"><label class="ui-visually-hidden" for="command-runner">PHP runner</label><select id="command-runner" aria-label="PHP runner"><option value="php">Local PHP</option><option value="docker">Docker</option></select><button type="button" id="command-docker-target" class="ui-button ui-icon-button" title="Choose Docker target" aria-label="Choose Docker target" hidden><span data-ui-icon="services" aria-hidden="true"></span></button></div>
      <small id="command-runner-target" class="command-muted" hidden></small>
      <span id="provenance" class="command-muted"></span>
      </header>
      <div id="commands" class="ui-menu ui-scroll-area" role="group" aria-label="Commands"></div>
      <p id="command-error" role="alert"></p>
    </aside>
    <section class="command-detail ui-scroll-area" aria-label="Selected command">
      <div id="command-empty" class="command-empty"><strong>Load Artisan commands</strong><p>Load this project's commands, then select one to configure and run.</p><button type="button" id="load-commands">Load commands</button></div>
      <div id="command-editor" class="command-editor" hidden>
      <h2 id="command-name">Choose a command</h2><p id="command-description"></p>
      <form id="arguments" autocomplete="off" aria-label="Command parameters"></form>
      <label for="command-preview">Captured run arguments</label><pre id="command-preview" tabindex="0">Select a command to inspect its arguments.</pre>
      <div class="command-actions"><button type="button" id="run" disabled><span data-ui-icon="run" aria-hidden="true"></span>Run</button><button type="button" id="terminal" disabled><span data-ui-icon="terminal" aria-hidden="true"></span>Run in Terminal</button><button type="button" id="cancel" disabled><span data-ui-icon="stop" aria-hidden="true"></span>Cancel</button><button type="button" id="copy" disabled><span data-ui-icon="copy" aria-hidden="true"></span>Copy Output</button><button type="button" id="rerun" disabled><span data-ui-icon="rerun" aria-hidden="true"></span>Rerun</button></div>
      <output id="command-status" role="status" aria-live="polite"></output>
      <label for="command-history">Session history</label><select id="command-history"><option value="">Choose a previous run…</option></select>
      <div class="command-output" aria-label="Command output"><pre id="stdout" tabindex="0"></pre><pre id="stderr" tabindex="0" aria-label="Standard error"></pre></div>
      </div>
    </section>
  </div>
</section>
