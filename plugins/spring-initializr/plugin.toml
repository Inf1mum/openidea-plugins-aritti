id = "aritti.spring-initializr"
name = "Spring Initializr Launcher"
version = "0.3.0" # x-release-please-version
description = "Starts a Spring Boot project from a tool window. Pick the build, language, Spring Boot and Java versions, coordinates, packaging and dependencies. Generate Project then downloads the project zip from a Spring Initializr server (start.spring.io or your own) in the browser, and Explore in Browser opens the server's web page with the same options, and Generate with Spring Boot CLI runs `spring init` in an IDE terminal when the Spring Boot CLI is allowed. The plugin remembers the form."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Plainer command names and a one-line status in the Spring Initializr window. Add Starters works with more Maven and Gradle layouts, including version catalogs, on build files up to 256 KiB, and confirms only the inserted lines; generated ZIPs keep executable scripts, the downloaded archive is deleted afterwards and a failed extract shows the kept folder; Generate and Open and source-only import are off for custom servers and refuse folders that are not on the machine running the project; unsaved form changes survive switching projects, and the plugin no longer wakes when a pom.xml opens; one name per command and clearer permission messages. \
0.3.0: Add Starters for Maven and Gradle and project generation. \
0.2.0: plugin icon and server list."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:initializr"]

[capabilities]
required = ["storage"]
optional = ["project.read", "process:spring", "process:python3", "net:start.spring.io", "editor.read"]

[[contributes.commands]]
id = "open-start"
title = "Spring Initializr: Open start.spring.io"
category = "Spring Initializr"

[[contributes.views]]
id = "initializr"
title = "Spring Initializr"
icon = "icons/springboot.svg"
location = "right"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "add-starters"
title = "Spring Initializr: Prepare Add Spring Boot Starters"
category = "Spring Initializr"

[[contributes.menus]]
menu = "tools"
command = "add-starters"

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["*"]

[[contributes.commands]]
id = "prepare-import"
title = "Spring Initializr: Prepare Maven Project Import…"
category = "Spring Initializr"

[[contributes.commands]]
id = "open-reviewed-import"
title = "Spring Initializr: Open Source Folder"
category = "Spring Initializr"

[[contributes.menus]]
menu = "tools"
command = "prepare-import"

[[contributes.menus]]
menu = "tools"
command = "open-reviewed-import"

[[contributes.commands]]
id = "generate-archive"
title = "Spring Initializr: Generate and Open…"
category = "Spring Initializr"
