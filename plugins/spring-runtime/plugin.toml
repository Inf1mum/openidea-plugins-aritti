id = "aritti.spring-runtime"
name = "Spring Runtime Insight"
version = "0.3.0" # x-release-please-version
description = "Reads the Actuator endpoints (beans, environment, conditions, health, mappings, configuration properties, scheduled tasks, loggers, caches) of a Spring Boot application running on localhost and shows them in a Spring Runtime tool window. Editor markers show which beans are loaded, and the runtime value and property source of @Value and configuration keys."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Secret-looking property values (password, secret, token, key, credentials) are masked in the tree, tooltips and saved data. Open Source no longer re-scans every file on each click and is only blocked by large files that could hold the class. Editor markers for one project no longer reset another project's polling or view. JMX Health and Info now return real data. A single timed-out endpoint keeps its previous data on refresh. The bean graph shows project beans first. Allow-capability errors say what to enable."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:runtime", "on-language:java", "on-language:kotlin", "on-file:**/application*.properties", "on-file:**/application*.yml", "on-file:**/application*.yaml", "on-file:**/bootstrap*.properties", "on-file:**/bootstrap*.yml", "on-file:**/bootstrap*.yaml"]

[capabilities]
required = ["project.read", "storage"]
optional = ["process:java", "database.sources", "net:localhost", "net:127.0.0.1", "secrets", "clipboard", "project.write"]

[[contributes.commands]]
id = "refresh"
title = "Spring Runtime: Refresh from Actuator"
category = "Spring Runtime"

[[contributes.commands]]
id = "read-jmx"
title = "Spring Runtime: Read JMX (localhost)…"
category = "Spring Runtime"

[[contributes.commands]]
id = "clear"
title = "Spring Runtime: Clear"
category = "Spring Runtime"

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["java", "properties", "yaml"]

[[contributes.secrets]]
name = "actuator-token"
label = "Actuator token"
description = "A bearer token or API key for protected Actuator endpoints (with Basic authentication: user:password encoded in Base64). Used when the actuatorAuth setting is bearer or basic."

[[contributes.views]]
id = "runtime"
title = "Spring Runtime"
icon = "icons/spring.svg"
location = "bottom"
web = "web/resources/hub.html"

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Runtime Insight"

[[contributes.commands]]
id = "snapshot-details"
title = "Spring Runtime: Inspect Cached Snapshot"
category = "Spring Runtime"

[[contributes.providers]]
kinds = ["inlay-hints"]
languages = ["properties", "yaml", "java", "kotlin"]

[[contributes.commands]]
id = "runtime-graph"
title = "Spring Runtime: Cached Bean Dependency Graph"
category = "Spring Runtime"

[[contributes.commands]]
id = "runtime-controls"
title = "Spring Runtime: Refresh and Poll Controls"
category = "Spring Runtime"

[[contributes.commands]]
id = "poll-start"
title = "Spring Runtime: Start Bounded Scoped Polling"
category = "Spring Runtime"

[[contributes.commands]]
id = "poll-stop"
title = "Spring Runtime: Stop Future Polls"
category = "Spring Runtime"

[[contributes.commands]]
id = "configure-snapshot-database"
title = "Configure Database from Runtime Snapshot"
category = "Spring Runtime"

[[contributes.menus]]
menu = "tools"
command = "configure-snapshot-database"

[[contributes.markerIcons]]
id = "runtime"
icon = "icons/marker-runtime.svg"
