id = "aritti.liquibase"
name = "Liquibase Changelogs"
version = "0.3.0" # x-release-please-version
description = "Liquibase changelog support for XML, YAML and formatted SQL. Versioned source checks flag local duplicate/incomplete changesets, unknown YAML change types and missing formatted SQL headers; cached source hover and include navigation are bounded; completes change types and their attributes in YAML and JSON and changeset comments in SQL; Go to Definition on include; New › Liquibase Changelog templates; status, validate and update-sql run configurations for projects with a liquibase.properties."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Run confirmations show the effect, target and command first. New Changeset and New Changelog create the entry on the open changelog; changelog include markers have their own icon, and missing include, includeAll and sqlFile targets are flagged in the editor; undeclared ${property} placeholders are flagged, with a setting to turn this off; offline structure checks for XML changelogs, faster on large changelogs and also for a changelog open before the plugin starts, and completion for JSON keys and SQL attributes; one name per action, and hover shows facts only. \
0.3.0: migration browser and generated changeset groups. \
0.2.0: plugin icon and audit improvements."""
categories = ["tools", "linters"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:xml", "on-language:yaml", "on-language:json", "on-language:sql", "on-view:changesets"]

[capabilities]
required = ["project.read"]
# process: reviewed offline diff and Update/Rollback commands; git: the author name offered in changesets.
# editor.*, project.write: New Changeset edits the open changelog; New Changelog… creates the file (and the parent include).
optional = ["process:liquibase", "process:git", "storage", "events", "editor.read", "editor.write", "project.write"]

[[contributes.commands]]
id = "choose-sources"
title = "Liquibase: Choose Sources…"
category = "Liquibase"

[[contributes.commands]]
id = "clear-sources"
title = "Liquibase: Browse All Changelogs"
category = "Liquibase"

[[contributes.commands]]
id = "update-confirmed"
title = "Liquibase: Update (Asks First)…"
category = "Liquibase"

[[contributes.commands]]
id = "new-changeset"
title = "Liquibase: New Changeset"
category = "Liquibase"

[[contributes.commands]]
id = "new-changelog"
title = "Liquibase: New Changelog…"
category = "Liquibase"

[[contributes.commands]]
id = "rollback-count"
title = "Liquibase: Rollback Count…"
category = "Liquibase"

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.providers]]
kinds = ["definition"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.providers]]
kinds = ["completion"]
languages = ["xml", "yaml", "json", "sql"]

# Database-writing operations remain freshly reviewed commands; never native Rerun.
[[contributes.runConfigurations]]
files = ["liquibase.properties"]

[[contributes.views]]
id = "changesets"
title = "Liquibase"
icon = "icons/liquibase.svg"
location = "bottom"
web = "web/resources/hub.html"

[[contributes.fileTemplates]]
id = "changelog-xml"
name = "Liquibase Changelog (XML)"
extension = "xml"
path = "templates/changelog.xml"

[[contributes.fileTemplates]]
id = "changelog-yaml"
name = "Liquibase Changelog (YAML)"
extension = "yaml"
path = "templates/changelog.yaml"

[[contributes.fileTemplates]]
id = "changelog-sql"
name = "Liquibase Changelog (Formatted SQL)"
extension = "sql"
path = "templates/changelog.sql"

[[contributes.fileIcons]]
id = "changelog"
patterns = ["db.changelog-*", "db.changelog.*", "liquibase.properties"]
icon = "icons/liquibase.svg"

[contributes.settings]
title = "Liquibase Changelogs"
schema = "settings.schema.json"

[[contributes.providers]]
kinds = ["diagnostics", "hover"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.commands]]
id = "offline-diff"
title = "Liquibase: Review Offline Snapshot Diff"
category = "Liquibase"

[[contributes.commands]]
id = "offline-diff-run"
title = "Liquibase: Run Offline Diff…"
category = "Liquibase"

[[contributes.markerIcons]]
id = "include"
icon = "icons/marker-include.svg"
