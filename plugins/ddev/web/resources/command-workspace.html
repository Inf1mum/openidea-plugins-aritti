<link rel="stylesheet" href="./command-workspace.css">
<section data-command-workspace aria-label="Artisan command workspace" data-i18n-aria-label="command.workspace">
  <div class="command-columns">
    <aside class="command-list">
      <header class="command-sidebar-header">
      <div class="command-search"><label class="ui-visually-hidden" for="command-search"><span data-i18n="command.find">Find a command</span></label><input id="command-search" type="search" placeholder="Find a command…" data-i18n-placeholder="command.findPlaceholder"><button type="button" id="discover" class="ui-button ui-icon-button" title="Refresh commands" data-i18n-title="command.refresh" aria-label="Refresh commands" data-i18n-aria-label="command.refresh"><span data-ui-icon="update" aria-hidden="true"></span></button></div>
      <div class="command-runner-controls"><label class="ui-visually-hidden" for="command-runner"><span data-i18n="command.runner">PHP runner</span></label><select id="command-runner" aria-label="PHP runner" data-i18n-aria-label="command.runner"><option value="php" data-i18n="command.localPhp">Local PHP</option><option value="docker">Docker</option></select><button type="button" id="command-docker-target" class="ui-button ui-icon-button" title="Choose Docker target" data-i18n-title="command.dockerTarget" aria-label="Choose Docker target" data-i18n-aria-label="command.dockerTarget" hidden><span data-ui-icon="services" aria-hidden="true"></span></button></div>
      <small id="command-runner-target" class="command-muted" hidden></small>
      <span id="provenance" class="command-muted"></span>
      </header>
      <div id="commands" class="command-sidebar-items ui-menu ui-scroll-area" role="group" aria-label="Commands" data-i18n-aria-label="command.commands"></div>
      <p id="command-error" role="alert"></p>
    </aside>
    <section class="command-detail ui-scroll-area" aria-label="Selected command" data-i18n-aria-label="command.selected">
      <div id="command-empty" class="command-empty"><strong><span data-i18n="command.loadTitle">Load Artisan commands</span></strong><p><span data-i18n="command.loadHelp">Load this project's commands, then select one to configure and run.</span></p><button type="button" id="load-commands"><span data-i18n="command.load">Load commands</span></button></div>
      <div id="command-editor" class="command-editor" hidden>
      <h2 id="command-name"><span data-i18n="command.choose">Choose a command</span></h2><p id="command-description"></p>
      <form id="arguments" autocomplete="off" aria-label="Command parameters" data-i18n-aria-label="command.parameters"></form>
      <section id="command-additional" hidden aria-label="Additional command arguments" data-i18n-aria-label="command.additional"><label for="command-extra-options"><span data-i18n="command.additionalOptions">Additional options</span><input id="command-extra-options" autocomplete="off" spellcheck="false" placeholder='--custom-option="value with spaces"'></label><label for="command-extra-arguments"><span data-i18n="command.additionalArguments">Additional arguments</span><input id="command-extra-arguments" autocomplete="off" spellcheck="false" placeholder='"extra value"'></label><small class="command-muted"><span data-i18n="command.additionalHelp">Quotes group values; no shell expansion. Options precede configured positional arguments; additional arguments follow them.</span></small></section>
      <label for="command-preview"><span data-i18n="command.preview">Captured run arguments</span></label><pre id="command-preview" tabindex="0"><span data-i18n="command.previewHelp">Select a command to inspect its arguments.</span></pre>
      <div class="command-actions"><button type="button" id="run" disabled><span data-ui-icon="run" aria-hidden="true"></span><span data-i18n="command.run">Run</span></button><button type="button" id="terminal" disabled><span data-ui-icon="terminal" aria-hidden="true"></span><span data-i18n="command.terminal">Run in Terminal</span></button><button type="button" id="cancel" disabled><span data-ui-icon="stop" aria-hidden="true"></span><span data-i18n="shared.cancel">Cancel</span></button><button type="button" id="copy" disabled><span data-ui-icon="copy" aria-hidden="true"></span><span data-i18n="command.copyOutput">Copy Output</span></button><button type="button" id="rerun" disabled><span data-ui-icon="rerun" aria-hidden="true"></span><span data-i18n="command.rerun">Rerun</span></button></div>
      <output id="command-status" role="status" aria-live="polite"></output>
      <label for="command-history"><span data-i18n="command.history">Session history</span></label><select id="command-history"><option value="" data-i18n="command.chooseHistory">Choose a previous run…</option></select>
      <div class="command-output" aria-label="Command output" data-i18n-aria-label="command.output"><pre id="stdout" tabindex="0"></pre><pre id="stderr" tabindex="0" aria-label="Standard error" data-i18n-aria-label="command.stderr"></pre></div>
      </div>
    </section>
  </div>
</section>
