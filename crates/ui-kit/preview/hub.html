<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plugin resource preview · Sample data</title><link rel="stylesheet" href="../web/hub.css"></head>
<body>
<header><div><span id="plugin">Sample plugin</span><h1 id="title">Project resources</h1></div><button id="reload" type="button" class="ui-button"><span data-ui-icon="update"></span>Refresh</button></header>
<div id="notice" role="status" aria-live="polite"></div>
<progress id="request-progress" class="ui-progress request-progress" aria-label="Loading resources" hidden></progress>
<div class="shell"><nav id="sections" aria-label="Sections" hidden></nav><main>
<div id="toolbar" class="toolbar" aria-label="Actions"></div>
<div id="filters" class="filters"><label class="search">Search<input id="search" class="ui-input" type="search" placeholder="Filter resources…"></label><div id="facets"></div><button id="clear" class="ui-button ui-button--quiet" type="button">Clear filters</button></div>
<div class="workspace"><section id="content" aria-label="Resources" tabindex="-1"></section><aside id="details" aria-label="Selected resource" hidden></aside></div><footer id="status" role="status"></footer>
</main></div><script src="../web/icons.js"></script><script src="../web/widgets.js"></script><script src="../web/controls.js"></script><script src="./fixture.js"></script><script src="../web/hub.js"></script>
</body></html>
